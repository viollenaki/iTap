version: '3.8'

services:
  backend:
    build: .
    container_name: itap-backend
    ports:
      - "8000:8000"
    volumes:
      - sqlite_data:/app/data
      - ./app:/app/app
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

volumes:
  sqlite_data:
